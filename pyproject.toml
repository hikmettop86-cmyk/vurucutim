[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "short-bot"
version = "0.1.43"
description = "RSS → YouTube Shorts video generator"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.6",
    "requests>=2.31",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "playwright>=1.40",
    "pillow>=10.1",
    "ffmpeg-python>=0.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "filelock>=3.13",
    "ddgs>=9.0",
    "rapidfuzz>=3.0",
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "apscheduler>=3.10",
    "flask-wtf>=1.2",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1.0",
    "cryptography>=42.0",
    "PySocks>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]

[project.scripts]
short-bot = "short_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"short_bot.web" = ["sample_scripts/*.json", "templates/**/*.html.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
