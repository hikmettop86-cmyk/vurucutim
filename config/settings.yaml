ffmpeg_path: ffmpeg
claude_cli_path: claude
playwright_browser: chromium
web:
  host: 127.0.0.1
  port: 5005
fuzzy_dedup_threshold: 0.85
log_level: INFO
claude_models:
  dna: opus            # DNA/persona → Opus (Claude CLI)
  default: sonnet      # skorlama/konu/metadata → Sonnet 5 (Claude CLI)
  script: sonnet       # senaryo/yargic/doktor → Sonnet 5 (Claude CLI)
  vision: default      # (hybrid'de kullanilmaz; vision Google Studio'ya gider)
# hybrid: metin -> OpenRouter (asagidaki modeller), vision -> Google Studio havuzu.
# OLCULDU 2026-07-16: gemini-3.1-flash-lite ~4sn/$0.002 persona-sadik; CLI Sonnet
# ~7-cagri burst'te Max-plan rate-limit thrash'i, OR Sonnet ~89sn/$0.10.
# DNA (nadir, yuksek bahis) Sonnet 5; video-basi metin gemini-flash-lite.
# vision satiri = Google havuzu tukenince OR gemma fallback.
ai_backend: hybrid
openrouter_models:
  dna: anthropic/claude-sonnet-5
  default: google/gemini-3.1-flash-lite
  script: google/gemini-3.1-flash-lite
  vision: google/gemma-4-26b-a4b-it
google_studio:
  vision_model: gemini-3.1-flash-lite
trends:
  enabled: true
  refresh_minutes: 60
  default_sources:
  - google_daily
  - youtube
  cache_max_age_minutes: 90.0
whisper:
  quality: auto
  device: auto
footage:
  priority:
  - pexels
  - pixabay
