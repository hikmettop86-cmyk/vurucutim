    - uzun teknik analiz
    - duygusuz raporlama
    # Ölçüm (442 video): "BOMBA" 42 manşette kullanılmış ve dönemin normalinin
    # %18 ALTINDA kalmış; ünlem içeren 104 manşet %16 altında. Kalıp
    # tekrarlandıkça yıpranıyor, sistemin bunu görecek mekanizması yoktu.
    - '"BOMBA" ve "ŞOK BOMBASI" gibi yıpranmış manşet klişeleri'
    - her manşeti ünlemle bitirmek
    sentence_max_words: 14
