slug: galatasaray
name: Galatasaray
keywords:
# Her anahtar AYRI Google News sorgusu atar (fetcher.fetch_rss). Tek
# "galatasaray" sorgusu transfer haberleriyle doluyordu: 442 videoluk analizde
# üretimin %50'si gelen-transferdi ve bu en zayıf kategoriydi (endeks 0.93,
# alt %10'un %59'u). Aşağıdaki anahtarlar, analizde en yüksek performansı
# veren ama havuza neredeyse hiç girmeyen konuları besler.
#
# ÖLÇÜLDÜ (24s taze / ana havuzda olmayan net katkı). Anahtar seçimi endekse
# DEĞİL arza bakmalı: yüksek performanslı bir kategori, o konuda her gün haber
# çıktığı anlamına gelmiyor.
- galatasaray
- Galatasaray Şampiyonlar Ligi     # 20 taze / 15 net — endeks 1.69, en iyi konu
- Galatasaray yönetim              # 14 taze /  8 net — endeks 1.29
# KALDIRILDI "Galatasaray başkan yönetim" (0 taze / 0 net) ve
# "Galatasaray TFF ceza tahkim" (0 taze / 0 net): üç kelimelik sorgular Google
# News'te dar eşleşip arşiv döndürüyordu — 148 sonucun HİÇBİRİ son 24 saatte
# değildi. İki kelimeli "Galatasaray yönetim" aynı konuyu 8 net haberle
# besliyor. hukuk-ceza (endeks 1.24) için taze besleyici bulunamadı: PFDK/ceza/
# tahkim sorgularının üçü de 0 taze verdi, çünkü o haberler her gün çıkmıyor.
# Çıktıklarında ana "galatasaray" sorgusu zaten yakalıyor — ölçüm günü iki
# gözaltı haberi de ana havuzdan gelmişti.
# categories: script'in seçebileceği canonical konu etiketleri. Serbest metin
# etiket learning/aggregator'ın kovalarını bölüyordu (aynı konuya "Transfer"
# 210, "transfer" 138, "Futbol Transfer" 14 kez). Liste, ölçülen performans
# ayrımlarını taşır — gelen/giden transfer ayrı, çünkü endeksleri farklı.
categories:
- transfer-gelen
- transfer-giden
- avrupa-kura
- yonetim-baskan
- hukuk-ceza
- kadro-karari
- mac-skor
- oyuncu-sozu
- magazin
- rakip
# Kotayı dolduran konunun adayı ELENMEZ, puanı düşer (taban = min_score).
# GEVŞETİLDİ (aynı gün, daha temiz ölçümle): ilk sınır transfer-gelen=2 idi ve
# tüm-dönem + anahtar-kelime eşleşmesine dayanıyordu (endeks 0.93). Canonical
# etiketli dönemde zaman-normalize ölçüm farklı söylüyor (n=150):
# transfer-giden 1.01, transfer-gelen 0.99, mac-skor 0.89, kadro-karari 0.63.
# Yani gelen-transfer ORTALAMA performanslı; sert kota üretimi kadro-karari
# gibi daha zayıf konulara itiyordu. Sınır çeşitlilik için korunuyor ama
# gevşetildi. kadro-karari (0.63) n=4 ile kotalanmadı — örneklem çok küçük.
category_quota_per_day:
  transfer-gelen: 3
  mac-skor: 1
# Saga sınırı: aynı ÖZNENİN (kişi/kulüp) tekrarında puan kademeli düşer.
# Ölçüm (2026-08-18, 29 gün): Batrakov 15 günde 4 kez, Gabriel Sara 29 günde
# 14 kez yayınlanmış. Mevcut dedup tek haber düzeyinde çalışıp gelen haberin
# %53'ünü eliyor ama sagayı görmüyor.
# Kategori kotasından farkı: bu cezanın min_score tabanı YOK, aday elenebilir
# ve koşu boş geçebilir. Gerekçe: üretilen 292 videonun yalnız 168'i yüklendi,
# yani boş geçmek yüklenmeyecek video üretmekten ucuz.
# 1.0 ÖLÇÜLMÜŞ DEĞİL — ilk tahmin. Bir hafta izlenip ayarlanacak.
saga_penalty_per_repeat: 1.0
saga_window_days: 14
# Hazırlık maçı içeriği ölçülen en zayıf tür: 4 videonun medyanı 25.336 =
# kanal medyanının %50'si (48.938 / 33.937 / 16.736 / 13.670 — dördü de
# tutarlı biçimde düşük) ve alt %10'un %15,9'unu oluşturuyor. Tek kelime
# "hazırlık" DEĞİL, iki kelimelik kalıp: "transfer hazırlığı" gibi meşru
# haberleri elememeli. Filtre locale_fold ile Türkçe I/ı eşlemesi yapar.
negative_keywords:
- hazırlık maçı
language: tr
schedule_cron: 0 */4 * * *
duration_s: 6
min_score: 6.0
max_candidates_per_run: 10
max_age_hours: 24
