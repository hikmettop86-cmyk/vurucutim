slug: deutschland-kompakt
name: Deutschland Kompakt
# keywords trend kaynağında SORGU DEĞİL: persona/DNA üretimi ve senaryo
# promptlarının kanalı tarif etmesi için kısa betimleyici.
keywords:
- Nachrichten aus Deutschland
- Eilmeldung
language: de
# Kaynak: Google Trends "Trending Now", bölge DE. Bölge dilden bağımsız bir
# ayardır; burada ikisi de Almanya/Almanca.
content_source: trends
trends_region: DE
# Sunucu saati Europe/Istanbul (UTC+3), Almanya UTC+2 (yaz) — cron 1 saat İLERİ
# yazılır ki Alman izleyicinin günü 07:00-22:00 arasına düşsün.
schedule_cron: 0 8-23/3 * * *
# ÖLÇÜLDÜ (2026-08-20, canlı DE Trends): 36 trendin 32'si ≥10.000, yalnız 4'ü
# 5.000-10.000 arası. Almanya'da hacimler Türkiye'ye göre düşük olduğundan
# 5.000 eşiği pratikte hiçbir şeyi elemiyordu; 10.000 zayıf kuyruğu kesip
# günde ~32 aday bırakıyor (6 video için fazlasıyla yeter).
trends_min_volume: 10000
# 6 sn kart AKIŞ içindir: saf olay önce (soru niyetli konuyu Klartext'e bırakır)
trends_intent: breaking
duration_s: 6
min_score: 6.0
max_candidates_per_run: 25
max_age_hours: 24
template: eilmeldung
colors:
  primary: '#0b3b73'
  accent: '#e2001a'
  bg_gradient:
  - '#1d2632'
  - '#10141a'
handle: '@deutschlandkompakt'
output_dir: output/deutschland-kompakt
enabled: true
youtube:
  auto_upload: false
  ai_content: false
  category_id: '25'
  privacy_status: public
  min_score_for_upload: 6.0
  cron_preset: null
# Kart tam ekran tasarlandı; %88 ölçek üst/altta siyah bant bırakıyor.
bg_video:
  enabled: false
  scale: 0.88
  blur_px: 30
  dim: 0.25
# Kaynak zaten trend; ikinci kez trend puanı eklemek anlamsız.
trend_boost:
  enabled: false
bg_image_blur: 8
dna:
  archetype: eilmeldung
  palette:
    primary: '#0b3b73'
    accent: '#e2001a'
    bg_gradient:
    - '#1d2632'
    - '#10141a'
    body_bg:
    - '#10141a'
    - '#0a0d12'
    text_main: '#e8ebef'
    text_muted: '#97a1ad'
    header_top_color: ''
    header_bottom_color: ''
  fonts:
    headline: Fira Sans Condensed
    body: Fira Sans
    google_imports:
    - Fira+Sans+Condensed:wght@600;700
    - Fira+Sans:wght@400;500;600;700
    size_headline_top: null
    size_headline_bottom: null
  tone:
    voice: sachlich, klar, unaufgeregt, verlässlich
    style: Nachrichtenmeldung; erster Satz sagt WAS passiert ist, dann Wer/Wo/Wann
      und die Einordnung in einem Satz
    forbidden:
    - Verdächtige oder Opfer mit vollem Namen nennen (Pressekodex — 'mutmaßlich',
      'Max M.', 'die 73-Jährige')
    - unbestätigte Behauptung als Tatsache schreiben
    - Boulevard-Wörter wie 'SCHOCK', 'DRAMA', 'Wahnsinn', 'unfassbar'
    - Ausrufezeichen am Ende jeder Zeile
    - Panikmache und Angst-Zuspitzung
    - parteiische Wertung oder Wahlempfehlung
    - unnötige Anglizismen ('Breaking', 'Update', 'Statement')
    - lange Behördenfloskeln ('im Rahmen von', 'zeitnah', 'diesbezüglich')
    - englische Zahlen- und Datumsformate (richtig ist 1.500 / 20,5 Prozent /
      14:32 Uhr / 20.08.2026 — nicht 1,500 oder 2:32 PM)
    sentence_max_words: 13
    paragraph_sentences:
    - 3
    - 5
    # Almanca sözcükler Türkçeden uzun; aynı cümle sayısı daha çok karakter tutar.
    body_max_chars: 350
    headline_style_hint: 'Obere Zeile EIN Subjekt (1-2 Wörter, z.B. ''STUTTGART''),
      untere Zeile WAS PASSIERT IST (2-4 Wörter, z.B. ''BAHN ERFASST PERSON'');
      photo_overlay = Bauchbinde mit Zahl/Behörde/Ort.'
  banner_shape: flat
  highlight_style: underline
  chip_style: rounded
  category_icon: 📰
  search_query_template: '{header_top} {header_bottom} Deutschland Nachrichten'
  persona_summary: Nachrichtenkanal, der das meistgesuchte Thema des Tages in
    Deutschland in sechs Sekunden sachlich erklärt. Die Schlagzeile sagt, was
    passiert ist; der Fließtext liefert in drei Sätzen den Zusammenhang. Keine
    Zuspitzung, keine Meinung.
  custom_css: ''
  ui_badge: ''
  animation_style: none
