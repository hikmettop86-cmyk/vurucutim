slug: fenerbahce
name: Fenerbahçe
keywords:
# Galatasaray'a eklenen Şampiyonlar Ligi / yönetim anahtarları BURAYA
# EKLENMEDİ: 257 videoluk kendi ölçümü ters çıktı — avrupa-kura endeksi FB'de
# 0.43 (GS'de 1.69), yani üretimi zayıf konuya yöneltirdi. FB'nin en iyi konusu
# giden-transfer (1.20) ve o zaten mevcut sorgudan geliyor; ek anahtarı veri
# desteklemiyor.
- Fenerbahçe
categories:
- transfer-gelen
- transfer-giden
- avrupa-kura
- yonetim-baskan
- hukuk-ceza
- kadro-karari
- mac-skor
- oyuncu-sozu
- magazin
- rakip
# Kota YALNIZ performansı kanıtlı düşük konulara konur. Canonical etiketli
# dönemde, zaman-normalize endeks (n=142): transfer-giden 1.20, transfer-gelen
# 1.07, rakip 1.04, mac-skor 1.00, kadro-karari 0.78, yonetim-baskan 0.70,
# avrupa-kura 0.42. Yani FB'de gelen-transfer üretimin yarısı olmasına rağmen
# ortalamanın ÜSTÜNDE — kısıtlamak zarar verirdi. Kısıtlanan tek konu, dokuz
# videoyla ölçülmüş ve kanalın açık ara en zayıfı olan avrupa-kura (GS'de aynı
# konu 1.69 ile en iyisiydi; Fenerbahçe Şampiyonlar Ligi'nde değil).
category_quota_per_day:
  avrupa-kura: 1
# Hazırlık maçı FB'de de dipte (n=1, medyan 9.666 = kanal medyanının %23'ü);
# GS'de 4 videoda %50 ile doğrulanmıştı.
negative_keywords:
- hazırlık maçı
language: tr
schedule_cron: 0 */4 * * *
duration_s: 6
min_score: 6.0
max_candidates_per_run: 10
max_age_hours: 24
template: stadium
colors:
  primary: '#a30d2d'
  accent: '#ffb81c'
  bg_gradient:
  - '#0a0a0a'
  - '#3d0712'
handle: '@fenerbahce'
output_dir: output/fenerbahce
enabled: true
youtube:
  auto_upload: false
  ai_content: true
  category_id: '24'
  privacy_status: public
  min_score_for_upload: 8.0
  cron_preset: every_4h
bg_video:
  enabled: true
  scale: 0.88
  blur_px: 30
  dim: 0.4
trend_boost:
  enabled: false
  max_boost: 2.0
  min_term_length: 4
  fuzzy_threshold: 85
dna:
  archetype: stadium
  palette:
    primary: '#a30d2d'
    accent: '#ffb81c'
    bg_gradient:
    - '#0a0a0a'
    - '#3d0712'
    body_bg:
    - '#12060a'
    - '#1f0810'
    text_main: '#fff8e7'
    text_muted: '#e8c56a'
    header_top_color: ''
    header_bottom_color: ''
  fonts:
    headline: Oswald
    body: Inter
    google_imports:
    - Oswald:wght@500;600;700
    - Inter:wght@400;700;900
    size_headline_top: null
    size_headline_bottom: null
  tone:
    voice: coşkulu, tutkulu, dinamik, taraftar ruhlu
    style: vurucu, kısa, enerjik
    forbidden:
    - rakip takımı öven ifadeler
    - soğuk ve mesafeli resmi dil
    - uzun akademik cümleler
    - kararsız ve temkinli üslup
    - asılsız transfer dedikodusunu kesin haber gibi sunmak
    # Ölçüm (257 video): ünlemli 47 manşet kanal medyanının %79'unda kaldı.
    # DİKKAT — Galatasaray'a konan "BOMBA" yasağı buraya KONMADI: GS'de 42 kez
    # kullanılıp yıpranmışken (%82) FB'de 12 kullanımla hâlâ %195 getiriyor.
    # Klişe yasağı kanal-özel ölçümle konur, kopyalanmaz.
    - her manşeti ünlemle bitirmek
    sentence_max_words: 14
    paragraph_sentences:
    - 1
    - 3
    body_max_chars: 220
    headline_style_hint: Kısa, büyük harf ve duygu yüklü; oyuncu/takım adı + çarpıcı
      gelişme (örn. 'FENERBAHÇE'DEN DEV HAMLE')
  banner_shape: slanted
  highlight_style: bg-flat
  chip_style: pill
  category_icon: ⚽
  search_query_template: '{header_top} {category} football match'
  persona_summary: Fenerbahçe taraftarının nabzını tutan, coşkulu ve tutkulu bir spor
    kanalı. Sarı-lacivert gündemi, transferleri ve maç anlarını kısa, vurucu ve enerjik
    bir dille aktarır.
