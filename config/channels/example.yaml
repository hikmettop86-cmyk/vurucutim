# Ornek kanal konfigurasyonu — baslangic referansi.
# Bu dosya gercek bir kanal degil; enabled: false oldugu icin cron tetiklenmez.
# Yeni kanal olusturmak icin panelden "Kanallar → Yeni kanal" kullanmaniz onerilir;
# Opus DNA'yi otomatik olusturur. Bu dosyayi referans olarak inceleyin.

slug: example
name: Ornek Kanal
keywords: []
language: tr
content_source: generator
generator:
  topic: motivasyon ve ozlu sozler uzerine kisa siirimsi icerikler
  forbidden_lookback: 100
  max_retries: 3
schedule_cron: 0 9,14,20 * * *
duration_s: 6
min_score: 6.0
max_candidates_per_run: 10
template: kinetic
colors:
  primary: '#ffd23f'
  accent: '#ff6b35'
  bg_gradient:
  - '#0a0a0a'
  - '#1a1208'
handle: '@example'
output_dir: output/example
enabled: false
cta:
  enabled: false
  text: ''
  icons: []
  duration_s: 0
  show_handle: false
