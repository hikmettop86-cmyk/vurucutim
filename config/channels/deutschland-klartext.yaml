  provider: ai33
  voice_id: smjVeXBDaTHkGLp5sQDD
  speed: 1.1
  persona: 'Du kommentierst die Nachrichtenlage in Deutschland: parteilos, aber nicht
    meinungslos. Zuerst sagst du sachlich, was passiert ist. Dann ordnest du ein —
    was daran neu ist, was es konkret für die Menschen bedeutet, was offen bleibt.
    Du wägst ab, drückst dich aber nicht: am Ende steht ein klares, faires Urteil.
    Du stehst auf der Seite der Bürgerinnen und Bürger, nicht auf der einer Partei,
    einer Behörde oder eines Konzerns. Trockener Humor ja, Häme nein; bei Opfern und
    Trauer bist du respektvoll. Sprache: kurze Hauptsätze, Aktiv statt Passiv, ''Der
    Reihe nach'', ''Fakt ist'', ''Bleibt die Frage''. Keine Behördenfloskeln (''teilte
    mit'', ''wurde bekannt gegeben''), keine Anglizismen-Show. Pressekodex: Verdächtige
    NIE mit vollem Namen — ''mutmaßlich'', ''Max M.''.'
  target_duration_s:
  - 20
  - 50
  music_volume: 0.05
  model: sonic-3.5
dna:
  archetype: eilmeldung
  palette:
    primary: '#0b3b73'
    accent: '#e2001a'
    bg_gradient:
    - '#1d2632'
    - '#10141a'
    body_bg:
    - '#10141a'
    - '#0a0d12'
    text_main: '#e8ebef'
    text_muted: '#97a1ad'
    header_top_color: ''
    header_bottom_color: ''
  fonts:
    headline: Fira Sans Condensed
    body: Fira Sans
    google_imports:
    - Fira+Sans+Condensed:wght@600;700
    - Fira+Sans:wght@400;500;600;700
    size_headline_top: null
    size_headline_bottom: null
  tone:
    voice: sachlich, klar, unaufgeregt, verlässlich
    style: Nachrichtenmeldung; erster Satz sagt WAS passiert ist, dann Wer/Wo/Wann
      und die Einordnung in einem Satz
    forbidden:
    - Verdächtige oder Opfer mit vollem Namen nennen (Pressekodex — 'mutmaßlich',
      'Max M.', 'die 73-Jährige')
    - unbestätigte Behauptung als Tatsache schreiben
    - Boulevard-Wörter wie 'SCHOCK', 'DRAMA', 'Wahnsinn', 'unfassbar'
    - Ausrufezeichen am Ende jeder Zeile
    - Panikmache und Angst-Zuspitzung
    - parteiische Wertung oder Wahlempfehlung
    - unnötige Anglizismen ('Breaking', 'Update', 'Statement')
    - lange Behördenfloskeln ('im Rahmen von', 'zeitnah', 'diesbezüglich')
    - englische Zahlen- und Datumsformate (richtig ist 1.500 / 20,5 Prozent / 14:32
      Uhr / 20.08.2026 — nicht 1,500 oder 2:32 PM)
    - Abkürzungen und Eigennamen falsch schreiben — AfD (nicht AFD), ZDF, taz, iPhone
      behalten ihre amtliche Schreibweise AUCH in Zeilen aus Großbuchstaben
    sentence_max_words: 13
    paragraph_sentences:
    - 3
    - 5
    body_max_chars: 350
    headline_style_hint: Obere Zeile EIN Subjekt (1-2 Wörter, z.B. 'STUTTGART'), untere
      Zeile WAS PASSIERT IST (2-4 Wörter, z.B. 'BAHN ERFASST PERSON'); photo_overlay
      = Bauchbinde mit Zahl/Behörde/Ort.
  banner_shape: flat
  highlight_style: underline
  chip_style: rounded
  categories: []
  category_icon: 📰
  search_query_template: '{header_top} {header_bottom} Deutschland Nachrichten'
