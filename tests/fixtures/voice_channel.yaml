  enabled: true
  # Yer tutucu: Task 16'da panelden/list_voices'tan gelen gerçek id ile değiştir.
  # VoiceConfig doğrulaması enabled=true iken boş voice_id'yi reddeder.
  voice_id: elevenlabs_PLACEHOLDER
  speed: 1.0
  persona: enerjik, meraklı anlatıcı
